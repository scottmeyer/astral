[package]
name = "astral"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Git-backed agent contexts, bound worktrees, native handoffs, and a Responses proxy"
license = "MIT"
repository = "https://github.com/scottmeyer/astral"
autobins = false
default-run = "astral"

[[bin]]
name = "astral"
path = "src/bin/astral.rs"

[[bin]]
name = "astral-state"
path = "src/bin/astral-state.rs"

[[bin]]
name = "stats"
path = "src/bin/stats.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
errno = "0.3"
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = { version = "0.3.4", features = ["std"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
toml = "0.8.23"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
